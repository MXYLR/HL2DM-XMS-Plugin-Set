// Settings for the built-in HL2MP bots, executed by the xms_bots plugin on
// every map start.  Changing them here is enough -- nothing else reads this
// file.

// The XMS bot controller decides by itself when a bot joins and leaves, so
// the built-in bot manager must not keep a quota of its own.
hl2mp_bot_quota 0

// ...and it must not hold bots back either.  With the default 1, a bot added
// while no real player is on the server connects and is thrown away again
// before it ever enters the game, so "sm_bots add" on an empty server looks
// like it did nothing.  The plugin only ever adds a bot around a real player,
// so its own spawns are unaffected -- this only removes the switch that made
// a bot silently never appear.
hl2mp_bot_join_after_player 0

// How good the bot is in a fight.  0 easy, 1 normal, 2 hard (engine default),
// 3 expert -- expert reacts faster and shoots straighter, which is also what
// made the bots feel like they were aiming for you rather than fighting you.
// This is the engine's only working aim-and-reaction knob: a disassembly of
// server.dll shows hl2mp_bot_sniper_aim_error is registered but never read by
// any behaviour code in this build, so dropping the difficulty to normal is
// the way to take the auto-aim off.  The bunnyhop in xms.cfg is the separate,
// movement-side half of the bots' behaviour and is unaffected.
hl2mp_bot_difficulty 1

// How eager the bots are to pick something up with the gravity gun.
// 0.3 (the engine default) means only 30% of bots bother; 1.0 makes every
// bot a "prop freak" that goes looking for something to throw.
hl2mp_bot_prop_freak_ratio 1.0

// Only "important" props -- explosive barrels and the like -- are worth
// picking up.  Left at the default 0 the bot also grabs crates and furniture,
// which is where the two silly prop habits come from: it plods along carrying
// one, and it tries to suck up whatever it is standing on, which the gravity
// gun cannot do because the bot's own feet hold it down.
sm_cvar hl2mp_bot_prop_search_only_important 1

// How long it holds a prop before throwing it, in seconds (default 1).  Short,
// so the prop is something it uses rather than luggage it carries.
sm_cvar hl2mp_bot_physcannon_wait_fire_time 0.2

// When the bots bother with a health station or charger.  The engine already
// knows where they are -- CHL2MPBotGetHealth searches item_healthkit,
// item_healthvial, item_healthcharger, func_healthcharger and anything whose
// classname matches *charger*, and walks to it on its own -- but the health it
// insists on before going is 65% healthy (ok) or 30% (critical), so a bot that
// is merely hurt fights on and one that is nearly dead is already in the fight.
// Raising both makes the bot break off and heal sooner, which is the only lever
// that exists: no charger-specific bot cvar is in this build of server.dll.
sm_cvar hl2mp_bot_health_ok_ratio 0.8
sm_cvar hl2mp_bot_health_critical_ratio 0.5

// How far away a bot will look for that health (default 1000 near / 2000 far).
sm_cvar hl2mp_bot_health_search_near_range 1500

// The lines above are cheat-flagged, so a plain "hl2mp_bot_..." line here
// is refused -- sm_cvar is the way past that, and it works because this file
// is executed from the server console.

// Other knobs you may want:
//   hl2mp_bot_gravgun_only 1  -- every bot carries nothing but the gravity
//                                gun, so they fight purely by throwing props
//                                (and are harmless in a gunfight)
//   hl2mp_bot_difficulty 2    -- 0 easy, 1 normal, 2 hard, 3 expert (1 is set
//                                above; raise it here if the bots get too tame)
//   hl2mp_bot_melee_only 1    -- every bot carries nothing but melee weapons
//   sm_cvar hl2mp_bot_prop_search_important_range 400  -- how far it looks
//                                for those important props (default 400)
//   sm_cvar hl2mp_bot_disable_get_prop 1  -- no gravity-gun use at all
